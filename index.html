<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モグラ叩きゲーム</title>
    <style>
        /* CSS スタイル設定 */
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .game-container {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 20px;
            margin-top: 20px;
        }

        .hole {
            width: 100px;
            height: 100px;
            background-color: #8b4513;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 4px solid #5d2e0a;
        }

        .mole {
            width: 80px;
            height: 80px;
            background-color: #a0522d;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            bottom: -100%;
            left: 10px;
            transition: bottom 0.2s;
            cursor: pointer;
        }

        /* モグラが出現した時のクラス */
        .mole.up {
            bottom: 10px;
        }

        .score-board {
            font-size: 24px;
            margin: 20px;
        }

        .timer {
            font-size: 20px;
            color: #e74c3c;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #27ae60;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>モグラ叩きゲーム</h1>
    
    <div class="score-board">スコア: <span id="score">0</span></div>
    <div class="timer">残り時間: <span id="time-left">30</span>秒</div>
    
    <button id="start-btn">ゲーム開始</button>

    <div class="game-container">
        <!-- 9個の穴を作成 -->
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
    </div>

    <script>
        // JavaScript ロジック
        const holes = document.querySelectorAll('.hole');
        const moles = document.querySelectorAll('.mole');
        const scoreBoard = document.querySelector('#score');
        const timeLeftDisplay = document.querySelector('#time-left');
        const startBtn = document.querySelector('#start-btn');

        let lastHole;
        let timeUp = false;
        let score = 0;
        let timeLeft = 30;
        let timerId;

        // ランダムな出現時間を設定 (200ms ～ 1000ms)
        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        // 前回と同じ穴にならないようにランダムな穴を選択
        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        // モグラを出現させる
        function peep() {
            const time = randomTime(500, 1000);
            const hole = randomHole(holes);
            const mole = hole.querySelector('.mole');
            
            mole.classList.add('up');

            setTimeout(() => {
                mole.classList.remove('up');
                if (!timeUp) peep();
            }, time);
        }

        // ゲーム開始処理
        function startGame() {
            resetGame();
            timeUp = false;
            peep();
            
            // カウントダウン開始
            timerId = setInterval(() => {
                timeLeft--;
                timeLeftDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    timeUp = true;
                    startBtn.disabled = false;
                    alert('ゲーム終了！あなたのスコアは ' + score + ' です。');
                }
            }, 1000);

            startBtn.disabled = true;
        }

        // 初期化処理
        function resetGame() {
            score = 0;
            scoreBoard.textContent = score;
            timeLeft = 30;
            timeLeftDisplay.textContent = timeLeft;
        }

        // モグラを叩いた時の処理
        function bonk(e) {
            if (!e.isTrusted) return; // チート対策
            score++;
            this.classList.remove('up');
            scoreBoard.textContent = score;
        }

        // 各モグラにクリックイベントを設定
        moles.forEach(mole => mole.addEventListener('click', bonk));
        
        // スタートボタンにイベント設定
        startBtn.addEventListener('click', startGame);

    </script>
</body>
</html>
