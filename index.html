<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>もぐらたたき（調査用）</title>
    <style>
        .game-container { text-align: center; font-family: sans-serif; }
        .grid { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; justify-content: center; margin-top: 20px; }
        .hole { width: 100px; height: 100px; background-color: #8b4513; border-radius: 50%; position: relative; cursor: pointer; overflow: hidden; }
        .mole { width: 80px; height: 80px; background-color: #d2b48c; border-radius: 50%; position: absolute; top: 110%; left: 10px; transition: top 0.1s; }
        .mole.up { top: 10px; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>もぐらたたき</h1>
    <p>スコア: <span id="score">0</span> / 300 (理論最高値)</p>
    <p>残りもぐら: <span id="remaining">30</span></p>
    
    <button onclick="startGame(1)">モード1 (Easy: 1.0s)</button>
    <button onclick="startGame(2)">モード2 (Normal: 0.7s)</button>
    <button onclick="startGame(3)">モード3 (Hard: 0.5s)</button>
    <button onclick="startGame(4)">モード4 (Extreme: 0.3s)</button>

    <div class="grid" id="grid">
        <div class="hole" onclick="hit(0)"><div class="mole" id="mole0"></div></div>
        <div class="hole" onclick="hit(1)"><div class="mole" id="mole1"></div></div>
        <div class="hole" onclick="hit(2)"><div class="mole" id="mole2"></div></div>
        <div class="hole" onclick="hit(3)"><div class="mole" id="mole3"></div></div>
        <div class="hole" onclick="hit(4)"><div class="mole" id="mole4"></div></div>
        <div class="hole" onclick="hit(5)"><div class="mole" id="mole5"></div></div>
        <div class="hole" onclick="hit(6)"><div class="mole" id="mole6"></div></div>
        <div class="hole" onclick="hit(7)"><div class="mole" id="mole7"></div></div>
        <div class="hole" onclick="hit(8)"><div class="mole" id="mole8"></div></div>
    </div>
</div>

<script>
    let score = 0;
    let molesSpawned = 0;
    const maxMoles = 30; // 全モード共通の出現回数
    let isPlaying = false;
    let spawnTimer = null;
    let displayTime = 1000;

    function startGame(mode) {
        if (isPlaying) return; // 二重起動防止
        
        // モード別：もぐらが引っ込むまでの時間を設定
        const times = { 1: 1000, 2: 700, 3: 500, 4: 300 };
        displayTime = times[mode];

        // 初期化
        score = 0;
        molesSpawned = 0;
        isPlaying = true;
        document.getElementById('score').innerText = score;
        document.getElementById('remaining').innerText = maxMoles;

        nextSpawn();
    }

    function nextSpawn() {
        if (molesSpawned >= maxMoles) {
            endGame();
            return;
        }

        // 出現間隔は一定（1秒ごとに1匹出現）
        spawnTimer = setTimeout(() => {
            spawnMole();
            molesSpawned++;
            document.getElementById('remaining').innerText = maxMoles - molesSpawned;
            nextSpawn();
        }, 1000);
    }

    function spawnMole() {
        const holeIndex = Math.floor(Math.random() * 9);
        const mole = document.getElementById(`mole${holeIndex}`);
        
        if (mole.classList.contains('up')) {
            // 重複した場合は即座に別の穴で試行（出現数を保証するため）
            spawnMole(); 
            return;
        }

        mole.classList.add('up');

        // 指定時間後に自動で引っ込む
        setTimeout(() => {
            mole.classList.remove('up');
        }, displayTime);
    }

    function hit(index) {
        const mole = document.getElementById(`mole${index}`);
        if (mole.classList.contains('up')) {
            score += 10;
            document.getElementById('score').innerText = score;
            mole.classList.remove('up'); // 叩いたらすぐ消える
        }
    }

    function endGame() {
        isPlaying = false;
        clearTimeout(spawnTimer);
        alert(`ゲーム終了！スコア: ${score} / 300`);
    }
</script>

</body>
</html>
