<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スペース・ディフェンダー - Continuous Timer Edition</title>
    <style>
        :root {
            --bg-color: #050510;
            --panel-color: rgba(255, 255, 255, 0.05);
            --text-color: #ffffff;
            --accent-color: #00f2ff;
            --heat-color: #ff9f43;
            --danger-color: #ff4d4d;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            touch-action: none; 
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }

        /* 向き警告パネル */
        #orientation-warning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f3460;
            color: white;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            padding: 20px;
        }

        @media (orientation: portrait) {
            #orientation-warning { display: flex; }
        }

        /* タイトル画面 */
        #screen-title {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1b1b2f 0%, #050510 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s;
        }

        .btn-mode {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            margin: 8px;
            border-radius: 30px;
            cursor: pointer;
            width: 300px;
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.3);
            touch-action: manipulation;
        }

        .btn-fullscreen {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 20px;
            font-size: 14px;
            margin-top: 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .control-panel {
            width: 18%; 
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--panel-color);
            z-index: 10;
        }

        #game-field {
            flex-grow: 1;
            position: relative;
            background: #050510;
            box-shadow: inset 0 0 100px rgba(0, 242, 255, 0.1);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .btn-action {
            width: 85px;
            height: 85px;
            background: radial-gradient(circle, #ff4757, #e84118);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 6px 0 #8a2a1a;
            touch-action: none;
            cursor: pointer;
        }

        .joystick-base {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 242, 255, 0.2);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }
        .joystick-thumb {
            width: 50px;
            height: 50px;
            background: var(--accent-color);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.6);
            pointer-events: none;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: white;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
            pointer-events: none;
            z-index: 20;
        }

        .hud-top {
            display: flex;
            gap: 20px;
            font-size: 16px;
        }

        .heat-container {
            width: 200px;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            margin-top: 5px;
        }
        #heat-bar {
            width: 0%;
            height: 100%;
            background: var(--heat-color);
            transition: background 0.2s;
        }
        #heat-warning {
            color: var(--danger-color);
            font-size: 12px;
            height: 15px;
            text-transform: uppercase;
            visibility: hidden;
        }

        #screen-result {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 5, 20, 0.95);
            border: 2px solid var(--accent-color);
            padding: 40px;
            border-radius: 20px;
            color: white;
            text-align: center;
            display: none;
            z-index: 150;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
        }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <div style="width: 50px; height: 35px; border: 2px solid white; border-radius: 4px; margin-bottom: 20px;"></div>
        <h2>画面を横向きにしてください</h2>
        <button class="btn-fullscreen" onclick="toggleFullScreen()">全画面表示を試す</button>
    </div>

    <div id="screen-title">
        <h1 style="color: var(--accent-color); margin-bottom: 10px; font-size: 32px; letter-spacing: 4px;">SPACE DEFENDER</h1>
        <p style="color: #889; margin-bottom: 30px;">被弾中もタイムは止まらない！スピーディーに復活せよ</p>
        <button class="btn-mode" onclick="startGame(1)">MODE 1 (左スティック / 右FIRE)</button>
        <button class="btn-mode" onclick="startGame(2)">MODE 2 (右スティック / 左FIRE)</button>
        <button class="btn-fullscreen" onclick="toggleFullScreen()">全画面表示にする</button>
    </div>

    <div id="game-container">
        <div id="left-panel" class="control-panel"></div>
        <div id="game-field">
            <div id="hud">
                <div class="hud-top">
                    <div>TIME: <span id="timer">30</span>s</div>
                    <div>SCORE: <span id="score">0</span></div>
                    <div style="color: var(--accent-color)">BEST: <span id="best-score">0</span></div>
                </div>
                <div class="heat-container"><div id="heat-bar"></div></div>
                <div id="heat-warning">OVERHEATED!</div>
            </div>
            <canvas id="gameCanvas"></canvas>
            <div id="screen-result">
                <h2 style="color: var(--accent-color);">MISSION COMPLETE</h2>
                <div id="final-score" style="font-size: 48px; margin: 10px 0; font-weight: bold;">0</div>
                <div id="new-record" style="color: #ffeb3b; font-weight: bold; margin-bottom: 20px; display: none;">NEW RECORD!</div>
                <button class="btn-mode" style="width: 100%;" onclick="location.reload()">タイトルへ戻る</button>
            </div>
        </div>
        <div id="right-panel" class="control-panel"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('best-score');
        const timerEl = document.getElementById('timer');
        const heatBarEl = document.getElementById('heat-bar');
        const heatWarningEl = document.getElementById('heat-warning');
        const finalScoreEl = document.getElementById('final-score');
        const resultScreen = document.getElementById('screen-result');
        const newRecordEl = document.getElementById('new-record');

        let gameState = 'title';
        let score = 0;
        let timeLeft = 30;
        let gameMode = 1;
        let spawnIntervalId = null;
        let timerIntervalId = null;
        let animationFrameId = null;

        const player = {
            x: 0, y: 0, radius: 18,
            baseSpeed: 6.5,
            vx: 0, vy: 0, angle: 0, color: '#00f2ff',
            lastFireTime: 0, fireInterval: 120,
            heat: 0, isOverheated: false,
            heatIncreasePerShot: 4.8, coolDownRate: 0.35, overheatCoolDownRate: 0.5
        };

        const joystick = { active: false, pointerId: null, originX: 0, originY: 0, vectorX: 0, vectorY: 0, maxRadius: 45 };
        let actionPressed = false;
        const bullets = [];
        const enemies = [];
        const particles = [];
        const enemyTypes = [
            { type: 'S', size: 14, speed: 4.2, score: 50, color: '#ff4d4d' },
            { type: 'M', size: 24, speed: 2.8, score: 30, color: '#ff9f43' },
            { type: 'L', size: 38, speed: 1.6, score: 10, color: '#ee5253' }
        ];

        const keys = { up: false, down: false, left: false, right: false };

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            if (player.x === 0 || gameState === 'title') {
                player.x = canvas.width / 2;
                player.y = canvas.height / 2;
            }
        }
        window.addEventListener('resize', () => setTimeout(resize, 200));

        function createControls(mode) {
            const left = document.getElementById('left-panel');
            const right = document.getElementById('right-panel');
            left.innerHTML = ''; right.innerHTML = '';
            const joy = `<div class="joystick-base" id="joystick-base"><div class="joystick-thumb" id="joystick-thumb"></div></div>`;
            const act = `<div class="btn-action" id="btn-action">FIRE</div>`;
            
            if (mode === 1) { left.innerHTML = joy; right.innerHTML = act; }
            else { left.innerHTML = act; right.innerHTML = joy; }
            setupJoystickListeners();
            setupActionBtnListener();
        }

        function setupJoystickListeners() {
            const base = document.getElementById('joystick-base');
            const thumb = document.getElementById('joystick-thumb');
            if (!base || !thumb) return;
            base.addEventListener('pointerdown', (e) => {
                e.preventDefault(); if (joystick.active) return;
                const rect = base.getBoundingClientRect();
                joystick.originX = rect.left + rect.width / 2;
                joystick.originY = rect.top + rect.height / 2;
                joystick.active = true; joystick.pointerId = e.pointerId;
            });
            window.addEventListener('pointermove', (e) => {
                if (!joystick.active || e.pointerId !== joystick.pointerId) return;
                e.preventDefault();
                let dx = e.clientX - joystick.originX;
                let dy = e.clientY - joystick.originY;
                const dist = Math.hypot(dx, dy);
                if (dist > joystick.maxRadius) { dx = (dx / dist) * joystick.maxRadius; dy = (dy / dist) * joystick.maxRadius; }
                joystick.vectorX = dx / joystick.maxRadius;
                joystick.vectorY = dy / joystick.maxRadius;
                thumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            });
            const handleEnd = (e) => {
                if (e && e.pointerId !== joystick.pointerId) return;
                joystick.active = false; joystick.pointerId = null;
                joystick.vectorX = 0; joystick.vectorY = 0;
                thumb.style.transform = `translate(-50%, -50%)`;
            };
            window.addEventListener('pointerup', handleEnd);
            window.addEventListener('pointercancel', handleEnd);
        }

        function setupActionBtnListener() {
            const btn = document.getElementById('btn-action');
            if (!btn) return;
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); actionPressed = true; });
            btn.addEventListener('pointerup', (e) => { e.preventDefault(); actionPressed = false; });
            btn.addEventListener('pointerleave', (e) => { e.preventDefault(); actionPressed = false; });
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === ' ' || e.key === 'Enter') actionPressed = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === ' ' || e.key === 'Enter') actionPressed = false;
        });

        function spawnEnemy() {
            if (gameState !== 'playing') return;
            const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
            let x, y;
            const side = Math.floor(Math.random() * 4);
            if (side === 0) { x = Math.random() * canvas.width; y = -50; }
            else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + 50; }
            else if (side === 2) { x = -50; y = Math.random() * canvas.height; }
            else { x = canvas.width + 50; y = Math.random() * canvas.height; }
            const dx = (canvas.width / 2) - x;
            const dy = (canvas.height / 2) - y;
            const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.4;
            enemies.push({ x, y, vx: Math.cos(angle) * type.speed, vy: Math.sin(angle) * type.speed, ...type });
        }

        function respawn() {
            if (gameState === 'gameover') return;
            
            gameState = 'playing';
            enemies.length = 0;
            bullets.length = 0;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.heat = 0;
            player.isOverheated = false;
            joystick.vectorX = 0;
            joystick.vectorY = 0;
        }

        function startGame(mode) {
            gameMode = mode;
            gameState = 'playing';
            score = 0; 
            timeLeft = 30;
            
            if (spawnIntervalId) clearInterval(spawnIntervalId);
            if (timerIntervalId) clearInterval(timerIntervalId);
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            particles.length = 0;
            respawn(); 
            
            timerEl.innerText = timeLeft;
            scoreEl.innerText = score;
            bestScoreEl.innerText = localStorage.getItem('bestScore_mode' + mode) || 0;
            document.getElementById('screen-title').style.display = 'none';
            createControls(mode);
            resize();
            
            spawnIntervalId = setInterval(spawnEnemy, 750);
            timerIntervalId = setInterval(() => {
                // gameover以外はカウントを続ける（hit中も減るように修正）
                if (gameState === 'gameover') return; 
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameState = 'gameover';
            finalScoreEl.innerText = score;
            if (spawnIntervalId) clearInterval(spawnIntervalId);
            if (timerIntervalId) clearInterval(timerIntervalId);
            const savedBest = parseInt(localStorage.getItem('bestScore_mode' + gameMode)) || 0;
            if (score > savedBest) { localStorage.setItem('bestScore_mode' + gameMode, score); newRecordEl.style.display = 'block'; }
            else { newRecordEl.style.display = 'none'; }
            resultScreen.style.display = 'block';
        }

        function update() {
            if (gameState === 'hit' || gameState === 'gameover') {
                particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.035; if (p.life <= 0) particles.splice(i, 1); });
                return;
            }
            if (gameState !== 'playing') return;

            // クールダウン
            if (player.isOverheated) { player.heat -= player.overheatCoolDownRate; if (player.heat <= 5) { player.heat = 0; player.isOverheated = false; } }
            else if (!actionPressed) { player.heat = Math.max(0, player.heat - player.coolDownRate); }
            heatBarEl.style.width = player.heat + '%';
            heatBarEl.style.background = player.isOverheated ? 'var(--danger-color)' : (player.heat > 70 ? '#ffeb3b' : 'var(--heat-color)');
            heatWarningEl.style.visibility = player.isOverheated ? 'visible' : 'hidden';

            // 入力
            let inputX = joystick.vectorX;
            let inputY = joystick.vectorY;
            if (!joystick.active) {
                if (keys.left) inputX = -1;
                if (keys.right) inputX = 1;
                if (keys.up) inputY = -1;
                if (keys.down) inputY = 1;
                if (inputX !== 0 && inputY !== 0) { inputX *= 0.707; inputY *= 0.707; }
            }

            player.vx = inputX * player.baseSpeed;
            player.vy = inputY * player.baseSpeed;
            player.x += player.vx; player.y += player.vy;
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
            if (Math.hypot(player.vx, player.vy) > 0.1) player.angle = Math.atan2(player.vy, player.vx);
            
            if (actionPressed) {
                const now = Date.now();
                if (!player.isOverheated && now - player.lastFireTime >= player.fireInterval) {
                    bullets.push({ x: player.x + Math.cos(player.angle) * 20, y: player.y + Math.sin(player.angle) * 20, vx: Math.cos(player.angle) * 11, vy: Math.sin(player.angle) * 11 });
                    player.lastFireTime = now; player.heat += player.heatIncreasePerShot;
                    if (player.heat >= 100) { player.heat = 100; player.isOverheated = true; }
                }
            }

            bullets.forEach((b, i) => { b.x += b.vx; b.y += b.vy; if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1); });
            enemies.forEach((e, i) => {
                e.x += e.vx; e.y += e.vy;
                if (Math.hypot(e.x - player.x, e.y - player.y) < player.radius + e.size * 0.7) {
                    gameState = 'hit';
                    for(let k=0; k<25; k++) particles.push({ x: player.x, y: player.y, vx: (Math.random()-0.5)*7, vy: (Math.random()-0.5)*7, life: 1, color: player.color });
                    setTimeout(respawn, 1000); 
                    return;
                }
                bullets.forEach((b, j) => { if (Math.hypot(e.x - b.x, e.y - b.y) < e.size) { score += e.score; scoreEl.innerText = score; for(let k=0; k<10; k++) particles.push({x:e.x, y:e.y, vx:(Math.random()-0.5)*7, vy:(Math.random()-0.5)*7, life:1, color:e.color}); enemies.splice(i, 1); bullets.splice(j, 1); } });
                if (e.x < -100 || e.x > canvas.width + 100 || e.y < -100 || e.y > canvas.height + 100) enemies.splice(i, 1);
            });
            particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.035; if (p.life <= 0) particles.splice(i, 1); });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white'; ctx.globalAlpha = 0.15;
            for(let i=0; i<30; i++) ctx.fillRect(((i*13)%100/100)*canvas.width, ((i*17)%100/100)*canvas.height, 1.5, 1.5);
            ctx.globalAlpha = 1.0;
            bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fillStyle='#fff'; ctx.shadowBlur=10; ctx.shadowColor='#0ff'; ctx.fill(); ctx.shadowBlur=0; });
            enemies.forEach(e => { ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.atan2(e.vy, e.vx)); ctx.fillStyle=e.color; ctx.beginPath(); ctx.moveTo(e.size, 0); ctx.lineTo(-e.size/2, e.size/2); ctx.lineTo(-e.size/2, -e.size/2); ctx.closePath(); ctx.fill(); ctx.restore(); });
            particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill(); });
            ctx.globalAlpha = 1.0;
            if (gameState === 'playing') {
                ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
                ctx.fillStyle = player.isOverheated ? '#444' : player.color;
                ctx.beginPath(); ctx.moveTo(player.radius, 0); ctx.lineTo(-player.radius, player.radius); ctx.lineTo(-player.radius/2, 0); ctx.lineTo(-player.radius, -player.radius); ctx.closePath();
                if (!player.isOverheated) { ctx.shadowBlur = 15; ctx.shadowColor = player.color; }
                ctx.fill(); ctx.restore();
            }
        }

        function gameLoop() {
            update(); draw();
            if (gameState !== 'gameover') animationFrameId = requestAnimationFrame(gameLoop);
        }
        resize();
    </script>
</body>
</html>
